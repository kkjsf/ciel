<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ciel</title>
<meta name="description" content="La météo des modèles Météo-France, sans pub : heure par heure, 15 jours, gel, soleil et lune.">
<meta name="theme-color" content="#1d64b5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ciel">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://api.open-meteo.com" crossorigin>
<link rel="preconnect" href="https://ensemble-api.open-meteo.com" crossorigin>
<link rel="preconnect" href="https://air-quality-api.open-meteo.com" crossorigin>
<style>
:root {
  --bg: #eef2f7; --card: #fff; --ink: #142033; --muted: #5d6b7e; --faint: #8a97a8; --line: #e1e7ef;
  --chip: #eef2f7; --accent: #2563b0; --rain: #2f7fe0; --snow: #8fb0d6; --warn: #d9822b;
  --sun: #f5a524; --moon: #e8dca8; --cl: #d3dbe4; --cl2: #a7b4c4; --ol: #b3bfcc; --drop: #3b8ced; --flake: #7aa7d9;
  --night: rgba(40, 70, 130, .07); --shadow: 0 1px 2px rgba(20, 32, 51, .05), 0 6px 20px rgba(20, 32, 51, .06);
  --f0: transparent; --f1: #d4e7fa; --f2: #9ccaf3; --f3: #5aa2ec; --f4: #3653b8; --f3ink: #fff; --pop: #fff;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b111a; --card: #141c28; --ink: #e7edf5; --muted: #9aa8bb; --faint: #6d7b8f; --line: #223043;
    --chip: #1b2533; --accent: #6aa5ec; --rain: #5aa2f5; --snow: #a9c4e4;
    --cl: #b4c0ce; --cl2: #7d8da2; --ol: transparent; --drop: #6fb2ff; --flake: #b9d4f2;
    --night: rgba(0, 0, 0, .22); --shadow: none;
    --f1: #1d3550; --f2: #2a5686; --f3: #3f86d6; --f4: #6f8cf0; --pop: #1d2735;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b111a; --card: #141c28; --ink: #e7edf5; --muted: #9aa8bb; --faint: #6d7b8f; --line: #223043;
  --chip: #1b2533; --accent: #6aa5ec; --rain: #5aa2f5; --snow: #a9c4e4;
  --cl: #b4c0ce; --cl2: #7d8da2; --ol: transparent; --drop: #6fb2ff; --flake: #b9d4f2;
  --night: rgba(0, 0, 0, .22); --shadow: none;
  --f1: #1d3550; --f2: #2a5686; --f3: #3f86d6; --f4: #6f8cf0; --pop: #1d2735;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  font-variant-numeric: tabular-nums;
}
button { font: inherit; color: inherit; }
a { color: var(--accent); }
.wrap { max-width: 1100px; margin: 0 auto; padding: 0 0 32px; }

/* hero */
.hero {
  --cl: #f3f6fa; --cl2: #c9d3de; --ol: transparent; --drop: #a8d4ff; --flake: #eaf3ff; --moon: #f3ecc8;
  color: #fff; padding: calc(env(safe-area-inset-top) + 12px) 18px 18px;
  background: linear-gradient(165deg, var(--sky1, #1d64b5), var(--sky2, #4f97dc));
  border-radius: 0 0 28px 28px; transition: background .6s;
}
.hero-top { display: flex; align-items: center; gap: 6px; }
.place {
  display: inline-flex; align-items: center; gap: 6px; min-width: 0; flex: 1 1 auto;
  background: none; border: 0; padding: 6px 4px; font-size: 19px; font-weight: 650; cursor: pointer; text-align: left;
}
.place span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.place svg { flex: none; opacity: .85; }
.icon-btn {
  flex: none; width: 40px; height: 40px; border-radius: 50%; border: 0; display: grid; place-items: center;
  background: rgba(255, 255, 255, .14); cursor: pointer;
}
.icon-btn:hover { background: rgba(255, 255, 255, .24); }
.icon-btn.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.favs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 4px 0 0; }
.favs:empty { display: none; }
.favs button {
  flex: none; border: 0; border-radius: 99px; padding: 5px 11px; font-size: 13px; cursor: pointer;
  background: rgba(255, 255, 255, .14);
}
.favs button[aria-current="true"] { background: rgba(255, 255, 255, .32); font-weight: 600; }
.now { display: flex; align-items: center; gap: 14px; margin: 14px 0 6px; }
.now .ico { width: 84px; height: 84px; flex: none; }
.now .temp { font-size: 72px; font-weight: 300; line-height: 1; letter-spacing: -2px; }
.now .cond { font-size: 18px; font-weight: 600; }
.now .feel { font-size: 15px; opacity: .88; }
.summary { margin: 8px 0 0; font-size: 16px; line-height: 1.45; }
.nowcast { margin-top: 12px; background: rgba(255, 255, 255, .12); border-radius: 14px; padding: 10px 12px; }
.nowcast .nc-t { font-size: 13.5px; font-weight: 600; }
.nc-bars { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; align-items: end; height: 26px; margin-top: 8px; }
.nc-bars i { display: block; border-radius: 3px 3px 1px 1px; background: rgba(255, 255, 255, .22); min-height: 3px; }
.nc-bars i.wet { background: #a8d4ff; }
.nc-lab { display: grid; grid-template-columns: repeat(4, 1fr); font-size: 11px; opacity: .75; margin-top: 3px; }
.stamp { margin-top: 12px; font-size: 12px; opacity: .78; }
.skeleton { padding: 50px 0; opacity: .8; }

/* layout */
.banner { margin: 12px 16px 0; padding: 10px 14px; border-radius: 14px; background: #fff4e0; color: #6b4300; font-size: 13.5px; }
:root[data-theme="dark"] .banner { background: #3a2a10; color: #f3d39b; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .banner { background: #3a2a10; color: #f3d39b; } }
.grid { display: grid; gap: 14px; padding: 14px 16px 0; }
.col { display: grid; gap: 14px; align-content: start; min-width: 0; }
@media (min-width: 920px) {
  .wrap { padding: 16px 16px 40px; }
  .hero { border-radius: 28px; padding: 18px 26px 22px; }
  .grid { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); padding: 14px 0 0; }
  .banner { margin: 12px 0 0; }
}
.card { background: var(--card); border-radius: 20px; padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.card h2 {
  font-size: 12.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 650;
  margin: 0 0 12px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
}
.h2-note { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--faint); font-size: 12px; text-align: right; }
.ico { width: 32px; height: 32px; display: block; }
.note { font-size: 12.5px; color: var(--muted); margin: 10px 0 0; line-height: 1.45; }

/* hourly */
.hscroll { overflow-x: auto; margin: 0 -16px; padding: 0 16px 4px; scrollbar-width: thin; overscroll-behavior-x: contain; }
.hsvg { display: block; }
.hsvg text { fill: var(--ink); font-size: 12px; }
.hsvg .hl { fill: var(--muted); font-size: 13px; }
.hsvg .dl { fill: var(--ink); font-size: 12.5px; font-weight: 650; }
.hsvg .tl { font-size: 16px; font-weight: 650; }
.hsvg .rl { fill: var(--rain); font-size: 13px; font-weight: 650; }
.hsvg .pl { fill: var(--faint); font-size: 11px; }
.hsvg .wl { fill: var(--muted); font-size: 13px; }
.hsvg .gl { fill: var(--faint); font-size: 11px; }
.hsvg .gl.hi { fill: var(--warn); font-weight: 650; }

/* days */
.day {
  display: grid; grid-template-columns: 62px 34px 50px 38px minmax(40px, 1fr) 38px; align-items: center; gap: 6px;
  width: 100%; padding: 8px 0; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; cursor: pointer;
}
.day:first-child { border-top: 0; }
.day:hover { background: linear-gradient(90deg, transparent, var(--chip), transparent); }
.d-name b { display: block; font-weight: 600; font-size: 15.5px; }
.dots { display: flex; gap: 2px; margin-top: 3px; }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--accent); }
.dots.c1 i.on, .dots.c2 i.on { background: var(--warn); }
.d-rain { font-size: 13px; color: var(--rain); line-height: 1.2; font-weight: 600; }
.d-rain small { display: block; font-weight: 400; color: var(--faint); }
.d-min { text-align: right; color: var(--muted); font-size: 17px; }
.d-max { font-weight: 650; font-size: 17px; }
.d-bar { position: relative; height: 6px; border-radius: 3px; background: var(--chip); }
.d-bar s { position: absolute; top: -3px; bottom: -3px; border-radius: 6px; background: var(--line); opacity: .9; }
.d-bar i { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
.d-bar em { position: absolute; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: var(--card); border: 2.5px solid var(--ink); }
.sep { font-size: 12px; color: var(--faint); padding: 9px 0 5px; border-top: 1px dashed var(--line); }
.day-detail { padding: 4px 0 12px; }
.day-detail .dd-h { font-weight: 650; margin: 2px 0 8px; }
.day-detail ul { margin: 8px 0 0; padding-left: 18px; font-size: 13.5px; color: var(--muted); }
.day-detail li { margin: 2px 0; }

/* frost */
.headline { font-size: 16px; font-weight: 600; margin: 0 0 12px; display: flex; gap: 10px; align-items: center; }
.headline .badge { flex: none; width: 12px; height: 12px; border-radius: 50%; }
.nights { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(46px, 1fr); gap: 4px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 4px; }
.night { text-align: center; border-radius: 12px; padding: 6px 2px 5px; border: 1px solid var(--line); }
.night .n-d { display: block; font-size: 12px; color: var(--muted); }
.night b { display: block; font-size: 18px; margin: 2px 0 1px; }
.night .n-p { display: block; font-size: 11.5px; color: var(--muted); min-height: 14px; }
.night.f1 { background: var(--f1); border-color: var(--f1); }
.night.f2 { background: var(--f2); border-color: var(--f2); }
.night.f3 { background: var(--f3); border-color: var(--f3); color: var(--f3ink); }
.night.f4 { background: var(--f4); border-color: var(--f4); color: #fff; }
.night.f3 .n-d, .night.f3 .n-p, .night.f4 .n-d, .night.f4 .n-p { color: rgba(255, 255, 255, .85); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

/* sun */
.sun-arc { display: block; width: 100%; max-width: 360px; margin: 0 auto; }
.sun-arc text { fill: var(--muted); font-size: 12px; }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; margin-top: 10px; }
.kv div { font-size: 13px; color: var(--muted); }
.kv b { display: block; color: var(--ink); font-size: 18px; font-weight: 600; }
.moon { display: flex; gap: 14px; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.moon svg { flex: none; }
.moon b { display: block; font-size: 16px; }
.moon span { font-size: 13px; color: var(--muted); }

/* details */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tile { background: var(--chip); border-radius: 14px; padding: 10px 12px; min-width: 0; }
.tile .k { font-size: 12px; color: var(--muted); }
.tile .v { font-size: 20px; font-weight: 650; margin: 1px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .s { font-size: 12px; color: var(--muted); }
.lvl { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }

/* sources */
.src { width: 100%; border-collapse: collapse; font-size: 13px; }
.src td { padding: 7px 0; border-top: 1px solid var(--line); vertical-align: top; }
.src tr:first-child td { border-top: 0; }
.src td:first-child { padding-right: 10px; }
.src b { display: block; font-weight: 600; }
.src small { color: var(--muted); font-size: 12px; }
.src .run { text-align: right; white-space: nowrap; color: var(--muted); font-size: 12px; }
.links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.links a { font-size: 13px; padding: 7px 12px; border-radius: 99px; background: var(--chip); text-decoration: none; }
.foot { text-align: center; font-size: 12px; color: var(--faint); padding: 22px 16px 0; }
.foot button { background: none; border: 1px solid var(--line); border-radius: 99px; padding: 3px 10px; margin-left: 6px; cursor: pointer; color: var(--muted); font-size: 12px; }

/* place sheet */
.sheet {
  border: 0; padding: 0; width: min(560px, 100%); max-width: 100%; max-height: 86vh; margin: auto auto 0;
  border-radius: 22px 22px 0 0; background: var(--card); color: var(--ink);
}
.sheet::backdrop { background: rgba(5, 10, 20, .45); }
@media (min-width: 620px) { .sheet { margin: auto; border-radius: 22px; } }
.sheet-in { padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
.sheet-head { display: flex; gap: 8px; align-items: center; }
.sheet input {
  flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 11px 14px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); outline: none;
}
.sheet input:focus { border-color: var(--accent); }
.sheet .icon-btn { background: var(--chip); }
.sheet h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 16px 0 4px; }
.geo { margin-top: 10px; width: 100%; display: flex; gap: 8px; align-items: center; border: 0; background: var(--chip); border-radius: 12px; padding: 11px 14px; cursor: pointer; color: var(--accent); font-weight: 600; }
.row { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .pick { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 10px 2px; cursor: pointer; }
.row .pick small { display: block; color: var(--muted); font-size: 12.5px; }
.row .star { background: none; border: 0; width: 40px; height: 40px; cursor: pointer; color: var(--faint); font-size: 20px; }
.row .star[aria-pressed="true"] { color: var(--sun); }
.empty { color: var(--muted); font-size: 13px; padding: 8px 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- v2 : barre du bas et mini-barre au telephone, nouvelles cartes ---------- */
.tabbar, .minibar { display: none; }
@media (max-width: 919px) {
  body { padding-bottom: calc(78px + env(safe-area-inset-bottom)); }
  .tabbar {
    display: grid; grid-template-columns: repeat(6, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    padding: 6px 6px calc(8px + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--card) 86%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--line);
  }
  body:not([data-view="today"]) .minibar { display: block; }
  body [data-view] { display: none; }
  body[data-view="today"] [data-view="today"], body[data-view="days"] [data-view="days"], body[data-view="frost"] [data-view="frost"],
  body[data-view="sun"] [data-view="sun"], body[data-view="trust"] [data-view="trust"], body[data-view="explore"] [data-view="explore"] { display: block; }
}
.tabbar button { border: 0; background: none; display: grid; justify-items: center; gap: 3px; padding: 4px 0 2px; font-size: 10.5px; color: var(--muted); cursor: pointer; min-width: 0; white-space: nowrap; }
.tabbar svg { width: 24px; height: 24px; padding: 3px 10px; box-sizing: content-box; border-radius: 99px; transition: background .2s; }
.tabbar button[aria-current="true"] { color: var(--accent); font-weight: 650; }
.tabbar button[aria-current="true"] svg { background: color-mix(in srgb, var(--accent) 15%, transparent); }
.minibar {
  --cl: #f3f6fa; --cl2: #c9d3de; --ol: transparent; --drop: #a8d4ff; --flake: #eaf3ff; --moon: #f3ecc8;
  position: sticky; top: 0; z-index: 25; color: #fff; background: linear-gradient(165deg, var(--sky1, #1d64b5), var(--sky2, #4f97dc));
  padding: calc(env(safe-area-inset-top) + 6px) 16px 6px; border-radius: 0 0 18px 18px; box-shadow: 0 4px 14px rgba(0, 0, 0, .12);
}
.minibar button { all: unset; display: flex; align-items: center; gap: 8px; width: 100%; cursor: pointer; }
.minibar .mini-ico { width: 38px; height: 38px; }
.minibar b { font-size: 21px; font-weight: 600; }
.minibar span { font-weight: 650; }
.minibar small { margin-left: auto; opacity: .85; font-size: 12.5px; }
.hdots { display: flex; gap: 6px; justify-content: center; margin-top: 12px; }
.hdots:empty { display: none; }
.hdots button { width: 8px; height: 8px; padding: 0; border: 0; border-radius: 50%; background: rgba(255, 255, 255, .4); cursor: pointer; }
.hdots button[aria-current="true"] { background: #fff; }
.in-l { animation: inL .28s ease-out; }
.in-r { animation: inR .28s ease-out; }
@keyframes inL { from { transform: translateX(40px); opacity: .2; } }
@keyframes inR { from { transform: translateX(-40px); opacity: .2; } }
.seg { display: inline-flex; background: var(--chip); border-radius: 99px; padding: 2px; }
.seg button { border: 0; background: none; font-size: 12px; padding: 4px 11px; border-radius: 99px; color: var(--muted); cursor: pointer; text-transform: none; letter-spacing: 0; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(0, 0, 0, .14); }
.mchart, .dchart { display: block; width: 100%; height: auto; max-width: 560px; margin: 0 auto; }
.mchart text, .dchart text { fill: var(--muted); font-size: 11.5px; }
.dchart .vmax { fill: var(--ink); font-weight: 650; }
.mleg { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; margin: 8px 0 4px; }
.mleg span { display: inline-flex; align-items: center; gap: 6px; }
.mleg i { width: 16px; height: 3px; border-radius: 2px; display: inline-block; }
.verdict { font-size: 15px; font-weight: 600; margin: 0 0 10px; }
.rtab { width: 100%; border-collapse: collapse; font-size: 13.5px; margin-top: 10px; }
.rtab th, .rtab td { padding: 5px 4px; text-align: right; border-top: 1px solid var(--line); }
.rtab th:first-child, .rtab td:first-child { text-align: left; }
.rtab th { color: var(--muted); font-weight: 600; border-top: 0; }
.rtab td.off { background: color-mix(in srgb, var(--warn) 16%, transparent); }
.alert { display: flex; gap: 12px; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.alert div { flex: 1; font-size: 13px; color: var(--muted); }
.alert b { display: block; color: var(--ink); font-size: 14.5px; }
.alert button { flex: none; border: 0; border-radius: 99px; padding: 8px 14px; font-weight: 600; cursor: pointer; background: var(--accent); color: #fff; }
.alert button.ghost { background: var(--chip); color: var(--ink); }

/* ---------- v5 : normales, ressenti / humidite / UV par heure, en ce moment illustre, explorateur ---------- */
.an { display: block; font-size: 11.5px; font-weight: 650; color: var(--faint); line-height: 1.15; }
.an.hot { color: #e0782f; } .an.hot2 { color: #dc4a32; } .an.cold { color: #3d8fe0; } .an.cold2 { color: #6a74ee; }
.norm-pill { display: inline-flex; align-items: center; gap: 6px; margin-top: 7px; font-size: 12.5px; font-weight: 600; padding: 3px 11px 3px 8px; border-radius: 99px; background: rgba(255, 255, 255, .16); }
.norm-pill i { width: 9px; height: 9px; border-radius: 50%; background: #fff; }
.norm-pill.hot i { background: #ffb366; } .norm-pill.cold i { background: #9fd0ff; }
.hwrap { display: flex; margin-right: -16px; }
.hleg { flex: none; display: block; margin-left: -6px; }
.hwrap .hscroll { flex: 1; min-width: 0; margin: 0; padding: 0 16px 4px 2px; }
.hsvg .fl { font-size: 13.5px; font-weight: 650; }
.hsvg .hu { fill: var(--muted); font-size: 12.5px; }
.hsvg .uv { fill: #fff; font-size: 11.5px; font-weight: 700; }
.tile { position: relative; padding: 10px 12px 11px; }
.tile .k { display: flex; align-items: center; gap: 7px; }

<script>

/* ---------- dates ---------- */
const fKey = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' });

function ago(t, now = Date.now()) {
  const m = Math.round((now - t) / 60e3);
  if (m < 1) return "à l'instant";
  if (m < 60) return `il y a ${m} min`;
  const h = Math.floor(m / 60);
  return h < 24 ? `il y a ${h} h${m % 60 >= 10 && h < 3 ? ' ' + String(m % 60).padStart(2, '0') : ''}` : `il y a ${Math.round(h / 24)} j`;

/* ---------- nombres ---------- */
const deg = v => v == null ? '-' : `${(Math.round(v) + 0)}°`.replace('-', '−');

const sumOf = (idx, a) => idx.reduce((s, i) => s + (a[i] || 0), 0);

function pct(arr, q) {
  const a = arr.filter(v => v != null).sort((x, y) => x - y);
  if (!a.length) return null;
  const p = (a.length - 1) * q, lo = Math.floor(p), hi = Math.ceil(p);

  for (let i = 0; i < times.length - 1; i++) {

}
const DIRS = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSO', 'SO', 'OSO', 'O', 'ONO', 'NO', 'NNO'];
const dirName = d => d == null ? '' : DIRS[Math.round(d / 22.5) % 16];

// Couleur d'une temperature : bleu froid -> vert -> jaune -> orange -> rouge
const TSTOPS = [[-10, [91, 110, 225]], [0, [74, 163, 223]], [8, [76, 195, 164]], [16, [230, 200, 79]], [24, [240, 149, 63]], [32, [226, 83, 59]]];
function tc(t) {
  if (t <= TSTOPS[0][0]) return `rgb(${TSTOPS[0][1]})`;
  for (let i = 1; i < TSTOPS.length; i++) {
    const [t1, c1] = TSTOPS[i], [t0, c0] = TSTOPS[i - 1];
    if (t <= t1) { const f = (t - t0) / (t1 - t0); return `rgb(${c0.map((c, j) => Math.round(c + (c1[j] - c) * f))})`; }
  }
  return `rgb(${TSTOPS[TSTOPS.length - 1][1]})`;

/* ---------- soleil (calculateur NOAA, a la minute pres) et lune (Meeus, termes principaux) ---------- */
const rad = Math.PI / 180;
function solar(jd) {
  const T = (jd - 2451545) / 36525;
  const L0 = (280.46646 + T * (36000.76983 + T * 0.0003032)) % 360, M = 357.52911 + T * (35999.05029 - 0.0001537 * T);
  const e = 0.016708634 - T * (0.000042037 + 0.0000001267 * T), om = (125.04 - 1934.136 * T) * rad;
  const C = Math.sin(M * rad) * (1.914602 - T * (0.004817 + 0.000014 * T)) + Math.sin(2 * M * rad) * (0.019993 - 0.000101 * T) + Math.sin(3 * M * rad) * 0.000289;
  const lam = (L0 + C - 0.00569 - 0.00478 * Math.sin(om)) * rad;
  const eps = (23 + (26 + (21.448 - T * (46.815 + T * (0.00059 - T * 0.001813))) / 60) / 60 + 0.00256 * Math.cos(om)) * rad;
  const y = Math.tan(eps / 2) ** 2, l0 = L0 * rad, m = M * rad;
  const eot = 4 / rad * (y * Math.sin(2 * l0) - 2 * e * Math.sin(m) + 4 * e * y * Math.sin(m) * Math.cos(2 * l0) - 0.5 * y * y * Math.sin(4 * l0) - 1.25 * e * e * Math.sin(2 * m));
  return { decl: Math.asin(Math.sin(eps) * Math.sin(lam)), eot };

// Heure (timestamp) ou le soleil passe a l'angle zenithal donne : side -1 = matin, 1 = soir, 0 = midi solaire
function sunEvent(key, lat, lon, zenith, side) {
  const day0 = Date.parse(key + 'T00:00:00Z'), jd0 = day0 / DAY + 2440587.5;
  let t = 720;
  for (let k = 0; k < 4; k++) {
    const { decl, eot } = solar(jd0 + t / 1440);
    const ha = side ? Math.acos(Math.cos(zenith * rad) / (Math.cos(lat * rad) * Math.cos(decl)) - Math.tan(lat * rad) * Math.tan(decl)) / rad : 0;
    t = 720 - 4 * (lon - side * ha) - eot;
  }
  return day0 + t * 60e3;
}
function sunTimes(key, lat, lon) {
  const ev = (z, s) => sunEvent(key, lat, lon, z, s);
  return { noon: ev(90, 0), sunrise: ev(90.833, -1), sunset: ev(90.833, 1), dawn: ev(96, -1), dusk: ev(96, 1), golden: ev(84, 1) };
}
function moonPhase(t) {
  const d = t / DAY - 10957.5, sin = x => Math.sin(x * rad);
  const Ms = 357.529 + 0.98560028 * d, ls = 280.459 + 0.98564736 * d + 1.915 * sin(Ms) + 0.02 * sin(2 * Ms);
  const L = 218.316 + 13.176396 * d, M = 134.963 + 13.064993 * d, F = 93.272 + 13.22935 * d, D = 297.85 + 12.190749 * d;
  const lm = L + 6.289 * sin(M) + 1.274 * sin(2 * D - M) + 0.658 * sin(2 * D) + 0.214 * sin(2 * M) - 0.186 * sin(Ms) - 0.114 * sin(2 * F);
  const el = (((lm - ls) % 360) + 360) % 360;
  return { phase: el / 360, fraction: (1 - Math.cos(el * rad)) / 2 };
}
function moonName(p) {
  if (p < .03 || p > .97) return 'Nouvelle lune';
  if (p < .22) return 'Premier croissant';
  if (p < .28) return 'Premier quartier';
  if (p < .47) return 'Gibbeuse croissante';
  if (p < .53) return 'Pleine lune';
  if (p < .72) return 'Gibbeuse décroissante';
  if (p < .78) return 'Dernier quartier';
  return 'Dernier croissant';
}
function nextMoons(now) {
  let full = null, nw = null, prev = moonPhase(now).phase;
  for (let h = 1; h <= 31 * 24 && !(full && nw); h++) {
    const t = now + h * HOUR, p = moonPhase(t).phase;
    if (!full && prev < .5 && p >= .5) full = t;
    if (!nw && prev > .9 && p < .1) nw = t;
    prev = p;
  }

}
function moonSvg(p, f, r = 26) {
  const c = r + 2, waxing = p < .5, rx = Math.abs(1 - 2 * f) * r;
  const a1 = waxing ? 1 : 0, a2 = waxing ? (f < .5 ? 0 : 1) : (f < .5 ? 1 : 0);
  return `<svg width="${2 * c}" height="${2 * c}" viewBox="0 0 ${2 * c} ${2 * c}" aria-hidden="true">

const G = (x, y, s, inner) => `<g transform="translate(${x} ${y}) scale(${s})">${inner}</g>`;
const SUN = `<path d="${RAYS}" stroke="var(--sun)" stroke-width="3.5" stroke-linecap="round"/><circle cx="32" cy="32" r="12" fill="var(--sun)"/>`;
const MOON = `<path d="M40 46A16 16 0 1 1 30 16A20 20 0 0 0 40 46Z" fill="var(--moon)"/>`;
const CLOUD_SHAPES = '<circle cx="22" cy="40" r="10"/><circle cx="34" cy="30" r="13"/><circle cx="46" cy="40" r="10"/><rect x="22" y="37" width="24" height="13"/>';

// Open-Meteo repond parfois 503 « service overloaded » quelques minutes : on retente avant d'abandonner
async function getJSON(url, tries = 1) {
  for (let k = 1; ; k++) {
    try {
      const r = await fetch(url);
      if (r.ok) return r.json();
      if (r.status < 500 || k >= tries) throw Object.assign(new Error(`HTTP ${r.status}`), { status: r.status, final: true });
    } catch (e) {

}
function urls(p) {

  return {
    fc: `https://api.open-meteo.com/v1/forecast?${loc}&past_days=1&forecast_days=16&hourly=${HOURLY}`
      + `&minutely_15=precipitation,temperature_2m&past_minutely_15=4&forecast_minutely_15=12&models=${MODELS.map(m => m.id)}`,
    ens: `https://ensemble-api.open-meteo.com/v1/ensemble?${loc}&forecast_days=15&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&models=ecmwf_ifs025`,
    aq: `https://air-quality-api.open-meteo.com/v1/air-quality?${loc}&forecast_days=4&hourly=uv_index,european_aqi,${POLLENS.map(p => p[0] + '_pollen')}`,

const metaUrl = id => `https://api.open-meteo.com/data/${id}/static/meta.json`;

function ensStats(ens) {
  const out = {};

  const d = ens.daily;
  const members = v => Object.keys(d).filter(k => k === v || k.startsWith(v + '_member')).map(k => d[k]);
  const mx = members('temperature_2m_max'), mn = members('temperature_2m_min'), pr = members('precipitation_sum');
  d.time.forEach((t, i) => {
    const col = ms => ms.map(m => m[i]).filter(v => v != null);
    const X = col(mx), N = col(mn), P = col(pr);
    if (X.length < 10) return;
    out[dayKey(t * 1000)] = {
      n: X.length, max10: pct(X, .1), max90: pct(X, .9), min10: pct(N, .1), min90: pct(N, .9),
      pRain: P.filter(v => v >= 1).length / P.length, pFrost: N.filter(v => v <= 0).length / N.length,
    };

}
// Indice de confiance 1-5 : dispersion des maximales + desaccord sur la pluie (50 % = le plus incertain)
function confidence(e) {
  if (!e) return null;
  const spread = e.max90 - e.max10;
  const t = spread <= 2 ? 5 : spread <= 3 ? 4 : spread <= 4.5 ? 3 : spread <= 6.5 ? 2 : 1;
  const u = 1 - Math.abs(2 * e.pRain - 1);
  const r = u < .2 ? 5 : u < .4 ? 4 : u < .6 ? 3 : u < .8 ? 2 : 1;
  return Math.round((2 * Math.min(t, r) + Math.max(t, r)) / 3);

// Pictogramme du jour : orage s'il y en a, sinon le type de precipitation le plus frequent s'il pleut, sinon la nebulosite
function dayCode(H, idx) {
  const day = idx.filter(i => { const h = hourOf(H.t[i]); return h >= 7 && h <= 20; });
  const codes = day.map(i => H.weather_code[i + 1] ?? H.weather_code[i]).filter(c => c != null);
  if (!codes.length) return null;
  if (codes.some(c => c >= 95)) return Math.max(...codes);
  const rain = day.reduce((s, i) => s + (H.precipitation[i + 1] || 0), 0);
  const wet = codes.filter(c => c >= 51);
  if (rain >= 1 && wet.length) {
    const count = {};
    wet.forEach(c => count[c] = (count[c] || 0) + 1);
    return +Object.entries(count).sort((a, b) => b[1] - a[1] || b[0] - a[0])[0][0];
  }
  if (codes.filter(c => c === 45 || c === 48).length >= 4) return 45;
  const cc = mean(day.map(i => H.cloud_cover[i]));
  return cc == null ? 2 : cc < 20 ? 0 : cc < 45 ? 1 : cc < 80 ? 2 : 3;
}

const FROST = {

  gel: { label: 'Gel', cls: 'f3', rank: 4 },
  blanche: { label: 'Gelée blanche possible', cls: 'f2', rank: 3 },
  possible: { label: 'Gel possible', cls: 'f2', rank: 3 },
  faible: { label: 'Risque faible', cls: 'f1', rank: 1 },
  non: { label: 'Pas de gel', cls: 'f0', rank: 0 },

function frostLevel(tmin, clearCalm, p0) {

  if (p0 != null && p0 >= .25) return 'possible';

// Pour chaque heure et chaque variable, le premier modele qui a une valeur (sans liste : variables non suffixees, ex. ERA5)
function mergeHourly(h, models) {

    for (const m of models) { const a = h[v + '_' + m.id]; if (a && a[i] != null) return a[i]; }
    return null;

}

function build(data, place, now = Date.now(), norm = null) {
  const H = mergeHourly(data.fc.hourly, MODELS), t = H.t;
  addUv(H, data.aq);

  const iNow = Math.max(0, t.findLastIndex(x => x <= now));
  const sunCache = {};
  const sunFor = key => sunCache[key] || (sunCache[key] = sunTimes(key, place.lat, place.lon));
  const isNight = ts => { const s = sunFor(dayKey(ts)); return ts < s.sunrise || ts > s.sunset; };
  const ens = ensStats(data.ens);
  const todayKey = dayKey(now);

  const byDay = new Map();
  t.forEach((ts, i) => {
    if (i > last) return;
    const k = dayKey(ts);
    if (!byDay.has(k)) byDay.set(k, []);
    byDay.get(k).push(i);
  });
  const days = [];
  for (const [key, idx] of byDay) {
    if (key < todayKey || days.length >= 15) continue;
    const T = idx.map(i => H.temperature_2m[i]).filter(v => v != null);
    if (T.length < 18) continue;
    const votes = {};
    idx.forEach(i => votes[H.src[i]] = (votes[H.src[i]] || 0) + 1);
    days.push({
      key, idx, t0: t[idx[0]], tmin: Math.min(...T), tmax: Math.max(...T),
      rain: idx.reduce((s, i) => s + (H.precipitation[i + 1] || 0), 0),
      snow: idx.reduce((s, i) => s + (H.snowfall[i + 1] || 0), 0),
      gust: maxOf(idx, H.wind_gusts_10m), wind: maxOf(idx, H.wind_speed_10m),
      code: dayCode(H, idx), src: +Object.entries(votes).sort((a, b) => b[1] - a[1])[0][0], ens: ens[key],
      normal: norm ? normalOn(norm, key) : null,
    });
  }

  // Nuit = 18 h le jour J -> 10 h le lendemain. La proba ensemble porte sur la minimale du lendemain.
  const nights = [];
  for (const d of days) {
    const start = d.t0 + 18 * HOUR, end = start + 16 * HOUR;
    const w = [];
    for (let i = 0; i <= last; i++) if (t[i] >= start && t[i] <= end && H.temperature_2m[i] != null) w.push(i);
    if (w.length < 10) continue;
    const core = w.filter(i => { const hr = hourOf(t[i]); return hr >= 22 || hr <= 7; });
    const cloud = mean(core.map(i => H.cloud_cover[i])), wind = mean(core.map(i => H.wind_speed_10m[i]));
    const tmin = Math.min(...w.map(i => H.temperature_2m[i]));
    const next = dayKey(end), p0 = ens[next] ? ens[next].pFrost : null;
    const clearCalm = cloud != null && wind != null && cloud < 40 && wind < 10;
    nights.push({ key: d.key, next, end, tmin, cloud, wind, clearCalm, p0, level: frostLevel(tmin, clearCalm, p0) });
  }

  // Temperature actuelle : AROME au quart d'heure, interpolee a la minute
  const m15 = data.fc.minutely_15;
  let temp = null;
  if (m15) temp = interp(m15.time.map(s => s * 1000), m15.temperature_2m_meteofrance_arome_france_hd || [], now);
  if (temp == null) temp = interp(t, H.temperature_2m, now) ?? H.temperature_2m[iNow];

  return { place, data, H, t, iNow, now, last, days, nights, sunFor, isNight, ens, todayKey, temp, norm };
}

// Fiches climatologiques des stations, precalculees par tools/build_normales.py (le S3 de Meteo-France n'a pas de CORS).
// Station retenue : distance + 1 km par 15 m d'ecart d'altitude, + 10 km si ses normales ne couvrent pas 1991-2020.
const NORM_V = 1, LAPSE = 0.0065;

function km(lat1, lon1, lat2, lon2) {
  const r = Math.PI / 180, x = (lon2 - lon1) * r * Math.cos((lat1 + lat2) / 2 * r), y = (lat2 - lat1) * r;
  return 6371 * Math.hypot(x, y);

async function loadNormals(p, elev) {
  const key = 'norm:' + placeId(p), hit = store.get(key);
  if (hit && hit.v === NORM_V) return hit;

  let best = null;
  for (const [num, lat, lon, alt, full] of normIndex.stations) {
    const d = km(p.lat, p.lon, lat, lon), s = d + (elev == null ? 0 : Math.abs(alt - elev) / 15) + (full ? 0 : 10);
    if (!best || s < best.s) best = { s, num, d };

// divisee par l'effet de la moyenne sur un mois, pour que la courbe redonne bien les moyennes mensuelles.
function harmonics(m) {
  const c = [];
  for (let k = 0; k <= 3; k++) {
    let a = 0, b = 0;
    m.forEach((v, j) => { a += v * Math.cos(Math.PI * k * j / 6); b += v * Math.sin(Math.PI * k * j / 6); });

}

const stationTxt = N => N.n.toLowerCase().replace(/^(.*) \((l'|le|la|les)\)$/, (_, a, b) => b + (b.endsWith("'") ? '' : ' ') + a)

function nowcast(D) {

  if (!P || P.every(v => v == null)) return '';
  // valeur au temps T = cumul du quart d'heure qui finit a T
  const q = [];
  m.time.forEach((s, i) => { const end = s * 1000; if (end > D.now && q.length < 8 && P[i] != null) q.push({ start: end - 15 * 60e3, mm: P[i] }); });
  if (q.length < 4) return '';
  const wet = x => x.mm >= 0.05;
  const kind = mmh => mmh < 1 ? 'faible' : mmh < 4 ? 'modérée' : 'forte';
  let txt;
  if (!q.some(wet)) {
    const later = D.H.precipitation.slice(D.iNow + 1, D.iNow + 25).some(v => v >= 0.3);
    return later ? '<div class="nowcast"><div class="nc-t">Pas de pluie dans les 2 prochaines heures</div></div>' : '';
  }
  if (wet(q[0])) {
    const stop = q.find(x => !wet(x));
    const peak = Math.max(...q.map(x => x.mm)) * 4;
    txt = stop ? `Pluie ${kind(peak)} en cours, fin vers ${hm(stop.start)}` : `Pluie ${kind(peak)} pendant au moins 2 h`;
  } else {
    const first = q.find(wet);
    txt = `Pluie ${kind(first.mm * 4)} vers ${hm(first.start)}`;
  }
  const bars = q.map(x => `<i class="${wet(x) ? 'wet' : ''}" style="height:${Math.min(100, 12 + Math.sqrt(x.mm * 4 / 6) * 88)}%"></i>`).join('');
  const labs = [0, 2, 4, 6].map(k => q[k] ? `<span>${k ? hm(q[k].start) : 'maint.'}</span>` : '<span></span>').join('');
  return `<div class="nowcast"><div class="nc-t">${txt}</div><div class="nc-bars">${bars}</div><div class="nc-lab">${labs}</div></div>`;
}
function summary(D) {
  const { H, iNow, nights, days } = D, parts = [];
  const slot = i => H.precipitation[i + 1] || 0;
  const wetNow = slot(iNow) >= 0.3;
  const ahead = []; for (let i = iNow + 1; i <= Math.min(D.last - 1, iNow + 24); i++) ahead.push(i);
  if (wetNow) {
    const dry = ahead.find(i => slot(i) < 0.1);
    parts.push(dry ? `Pluie jusque vers ${hourOf(H.t[dry])}h` : 'Pluie durable dans les 24 h');
  } else {
    const wet = ahead.find(i => slot(i) >= 0.3);
    if (wet != null) {
      const when = dayKey(H.t[wet]) === D.todayKey ? '' : `${dayKey(H.t[wet]) === dayKey(D.now + DAY) ? 'demain ' : wd(H.t[wet]) + ' '}`;
      parts.push(`Pluie probable ${when}vers ${hourOf(H.t[wet])}h`);
    } else parts.push('Pas de pluie dans les 24 h');
  }
  const gustIdx = ahead.filter(i => (H.wind_gusts_10m[i] || 0) >= 60);
  if (gustIdx.length) {
    const g = Math.max(...gustIdx.map(i => H.wind_gusts_10m[i]));
    parts.push(`rafales jusqu'à ${Math.round(g / 5) * 5} km/h`);
  }

  if (n0 && FROST[n0.level].rank >= 3) parts.push(`${FROST[n0.level].label.toLowerCase()} cette nuit (${deg(n0.tmin)})`);
  if (days[1] && days[0]) {

const TCOL = { wind: '#2bb3a3', feel: '#f0953f', hum: '#3b8ced', uv: '#f5a524', air: '#4cb26c', pollen: '#d46fb0', press: '#8b7cf0', hier: '#7f93ad', rain: '#2f7fe0', norm: '#e0782f' };
const tileIco = id => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${TI[id]}</svg>`;
// Boussole : la fleche montre ou va le vent, comme dans l'heure par heure
const compass = dir => `<svg class="cmp" viewBox="-21 -21 42 42" aria-hidden="true"><circle r="19" fill="none" stroke="var(--line)" stroke-width="2"/>`

const AQI_COL = ['#50c8b4', '#7cc36a', '#e6c84f', '#f0953f', '#e2533b', '#8e44ad'];
const DIR_FROM = ['du nord', 'de nord-est', "d'est", 'de sud-est', 'du sud', 'de sud-ouest', "d'ouest", 'de nord-ouest'];
const dirFrom = d => DIR_FROM[Math.round(d / 45) % 8];
const humWord = h => h < 30 ? 'air sec' : h < 65 ? 'confortable' : h < 85 ? 'air humide' : 'très humide';
function renderDetails(D) {
  const { H, iNow, now } = D, tiles = [];
  const tile = (id, k, v, s, viz = '', cls = '') => tiles.push(`<div class="tile ${cls}" style="--tc:${TCOL[id]}"><div class="k">${tileIco(id)}<span>${k}</span></div><div class="v">${v}</div>${viz}<div class="s">${s}</div></div>`);
  const ws = H.wind_speed_10m[iNow], gu = H.wind_gusts_10m[iNow], wdir = H.wind_direction_10m[iNow];
  tile('wind', 'Vent', `${Math.round(ws)}<small>km/h</small>`, `${wdir != null ? `vent ${dirFrom(wdir)}, ` : ''}rafales ${Math.round(gu)} km/h`, compass(wdir), 'compass');
  const feel = H.apparent_temperature[iNow];
  if (feel != null && D.temp != null) {
    const df = feel - D.temp;
    tile('feel', 'Ressenti', deg(feel), Math.abs(df) < 1.5 ? 'comme au thermomètre'
      : `${Math.round(Math.abs(df))}° ${df < 0 ? 'de moins' : 'de plus'} qu'au thermomètre${df < 0 && ws >= 15 ? ', à cause du vent' : df > 0 && H.relative_humidity_2m[iNow] >= 60 ? ', air humide' : ''}`);
  }
  const hu = H.relative_humidity_2m[iNow];
  if (hu != null) tile('hum', 'Humidité', `${Math.round(hu)}<small>%</small>`, `${humWord(hu)}, point de rosée ${deg(H.dew_point_2m[iNow])}`, `<div class="meter"><i style="width:${Math.round(hu)}%"></i></div>`);
  const aq = D.data.aq && D.data.aq.hourly;
  if (aq) {
    const at = aq.time.map(s => s * 1000), ia = Math.max(0, at.findLastIndex(x => x <= now));
    const todayIdx = at.map((x, i) => i).filter(i => dayKey(at[i]) === D.todayKey);
    const uvMax = Math.max(...todayIdx.map(i => aq.uv_index[i] ?? 0));
    tile('uv', 'UV, maxi du jour', `${Math.round(uvMax)}<small>${UV(uvMax)[0].toLowerCase()}</small>`, `maintenant ${Math.round(aq.uv_index[ia] ?? 0)}`,
      scale(11, Math.max(1, Math.round(uvMax)), k => UV(k + .5)[1]));
    const a = aq.european_aqi[ia];

    }
    const pol = POLLENS.map(([k, name]) => [name, Math.max(...todayIdx.map(i => aq[k + '_pollen'][i] ?? 0))]).filter(x => POLL(x[1])).sort((x, y) => y[1] - x[1]);
    const lv = v => v < 10 ? 1 : v < 50 ? 2 : v < 200 ? 3 : 4;
    tile('pollen', 'Pollens', pol.length ? pol[0][0] : 'Faibles', pol.length ? '' : 'ou hors saison',
      pol.length ? `<div class="pol">${pol.slice(0, 3).map(([n, v]) => `<div><span>${n}</span><span class="lv" title="${POLL(v)}">${[1, 2, 3, 4].map(k => `<i class="${k <= lv(v) ? 'on' : ''}"></i>`).join('')}</span></div>`).join('')}</div>` : '');
  }
  const p = H.pressure_msl[iNow], i3 = D.t.findLastIndex(x => x <= now - 3 * HOUR), p3 = i3 >= 0 ? H.pressure_msl[i3] : null;
  if (p != null) {
    const trend = p3 == null ? '' : p - p3 >= 1 ? 'en hausse' : p - p3 <= -1 ? 'en baisse' : 'stable';
    const past = []; for (let i = Math.max(0, iNow - 24); i <= iNow; i++) if (H.pressure_msl[i] != null) past.push(H.pressure_msl[i]);
    const lo = Math.min(...past), hi = Math.max(...past, lo + 4);
    const line = past.length > 3 ? `<svg class="pline" viewBox="0 0 100 22" preserveAspectRatio="none" aria-hidden="true"><polyline points="${past.map((v, k) => `${(k / (past.length - 1) * 100).toFixed(1)},${(19 - (v - lo) / (hi - lo) * 16).toFixed(1)}`).join(' ')}" fill="none" stroke="var(--tc)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>` : '';
    tile('press', 'Pression', `${Math.round(p)}<small>hPa</small>`, trend ? `${trend} sur 3 h · courbe des 24 h` : 'au niveau de la mer', line);
  }
  const iY = D.t.findLastIndex(x => x <= now - DAY), tY = iY >= 0 ? H.temperature_2m[iY] : null;
  if (tY != null && D.temp != null) {
    const dt = Math.round(D.temp - tY);
    tile('hier', 'Comparé à hier', dt === 0 ? 'pareil' : `${dt > 0 ? '+' : '−'}${Math.abs(dt)}°`, `hier à ${hourOf(now)}h : ${deg(tY)}`);
  }
  const r24 = []; for (let i = iNow + 1; i <= Math.min(D.last, iNow + 24); i++) r24.push(i);
  const rain24 = sumOf(r24, H.precipitation), rmax = Math.max(1, ...r24.map(i => H.precipitation[i] || 0));
  // la pluie prend toute la largeur si elle resterait seule sur sa ligne
  tile('rain', 'Pluie sur 24 h', `${num1(Math.round(rain24 * 10) / 10)}<small>mm</small>`, rain24 < 0.1 ? 'temps sec' : `${r24.filter(i => (H.precipitation[i] || 0) >= 0.1).length} h de pluie`,
    `<div class="spark">${r24.map(i => { const v = H.precipitation[i] || 0; return `<i class="${v >= 0.1 ? 'w' : ''}" style="height:${Math.max(8, Math.sqrt(v / rmax) * 100).toFixed(0)}%"></i>`; }).join('')}</div>`,
    tiles.length % 2 ? '' : 'wide');
  const nm = D.days[0] && D.days[0].normal;
  if (nm) tile('norm', 'Normales du jour', `${deg(nm.tn)} · ${deg(nm.tx)}`, `${cap(records(D.norm, nm.month))}. Station ${esc(stationTxt(D.norm))}.`, '', 'wide');
  $('details').innerHTML = `<div class="tiles">${tiles.join('')}</div>`;
}

/* ---------- rendu : sources ---------- */
// meme forme d'URL sur meteofrance.com et vigilance.meteofrance.fr : "L'Isle-Jourdain" -> "l-isle-jourdain"
function slug(s) {
  return s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/['’]/g, '-').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
}
function renderSources(D) {
  const h = D.data.fc.hourly, meta = D.data.meta || {};

  const until = t => t ? `jusqu'à ${wd(t).replace('.', '').toLowerCase()} ${dayNum(t)}, ${hourOf(t)}h` : 'indisponible ici';
  const runOf = id => meta[id] ? `run de ${hm(meta[id].init * 1000)}<br>reçu ${ago(meta[id].avail * 1000, D.now)}` : '';
  const rows = [
    ['AROME 1,5 km', `Météo-France, le modèle le plus fin, ${until(end('meteofrance_arome_france_hd'))}`, runOf('meteofrance_arome_france_hd')],
    ['ARPEGE 11 km', `Météo-France, prend le relais ${until(end('meteofrance_arpege_europe'))}`, runOf('meteofrance_arpege_europe')],
    ['ECMWF IFS 9 km', `Centre européen, dont Météo-France est membre et qu'elle utilise elle aussi au-delà de 4 jours`, runOf('ecmwf_ifs')],
    ['ECMWF, 51 scénarios', 'Indice de confiance, probabilités de pluie et de gel', runOf('ecmwf_ifs025_ensemble')],
    ['Copernicus CAMS', 'UV, qualité de l\'air et pollens', ''],
  ];
  const N = D.norm;
  if (N) rows.push(['Normales et records', `Météo-France, fiche climatologique de la station ${esc(stationTxt(N))} (${N.alt} m, à ${Math.round(N.dist)} km), normales ${N.p}${altFix(N) ? `, corrigées de ${anomTxt(altFix(N))} pour l'altitude du lieu (${Math.round(N.elev)} m)` : ''}`, `fiche du<br>${N.edition}`]);
  const p = D.place;
  const links = [];
  if (N) links.push(`<a href="${FICHE_URL(N.num)}" target="_blank" rel="noopener">Fiche de la station</a>`);
  if (p.cp) links.push(`<a href="https://meteofrance.com/previsions-meteo-france/${slug(p.name)}/${p.cp}" target="_blank" rel="noopener">Comparer sur meteofrance.com</a>`);
  if (p.dep) links.push(`<a href="https://vigilance.meteofrance.fr/fr/${slug(p.dep)}" target="_blank" rel="noopener">Vigilance ${esc(p.dep)}</a>`);
  $('sources').innerHTML = `<table class="src">${rows.map(r => `<tr><td><b>${r[0]}</b><small>${r[1]}</small></td><td class="run">${r[2]}</td></tr>`).join('')}</table>
    <div class="links">${links.join('')}</div>
    <p class="note">Données Météo-France (Licence Ouverte Etalab), ECMWF et Copernicus (CC BY 4.0), servies par <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>. Normales et records : fiches climatologiques Météo-France (meteo.data.gouv.fr), station la plus proche à altitude comparable. Communes : API Adresse et geo.api.gouv.fr. Position du soleil et de la lune calculée sur l'appareil.</p>`;
}

/* ---------- etat, chargement ---------- */
let state = { place: null, data: null, loading: false };
const placeId = p => `${p.lat.toFixed(3)},${p.lon.toFixed(3)}`;
function render() {
  if (!state.data) return;
  const norm = state.norm && state.norm.pid === placeId(state.place) ? state.norm : null;
  const D = build(state.data, state.place, Date.now(), norm);
  for (const fn of [renderHero, renderHourly, renderDays, renderFrost, renderSun, renderDetails, renderSources, renderMini, renderModels, renderDaysChart]) {
    try { fn(D); } catch (e) { console.error(fn.name, e); }
  }
  state.D = D;
  renderFavs();
  ensureNorm(state.place);
  if (!xp.started && (wide.matches || document.body.dataset.view === 'explore')) xpStart();
  else if (xp.started && !xp.own && placeId(xp.place) !== placeId(state.place)) { xp.place = state.place; xpLoad(); }
}
function banner(msg) { const b = $('banner'); b.hidden = !msg; b.textContent = msg || ''; }
function cacheData(p, data) {
  const ids = store.get('cached', []).filter(x => x !== placeId(p));
  ids.unshift(placeId(p));
  ids.slice(6).forEach(x => store.del('data:' + x));
  store.set('cached', ids.slice(0, 6));
  if (!store.set('data:' + placeId(p), data)) store.del('data:' + placeId(p));
}
// Un lieu sans donnees en cache vide l'ecran : jamais les previsions d'un autre lieu sous son nom
function clearView() {
  state.data = null;
  document.title = `${state.place.name} - Ciel`;
  $('heroBody').innerHTML = '<div class="skeleton">Chargement des prévisions...</div>';
  for (const id of ['hourly', 'days', 'frost', 'sun', 'details', 'sources', 'hourlyNote', 'models', 'daysChart']) $(id).innerHTML = '';
}
async function load(place) {
  const switching = !state.place || placeId(state.place) !== placeId(place);
  state.place = place;
  store.set('place', place);
  setHash(place);
  $('placeName').textContent = place.name;
  const cached = store.get('data:' + placeId(place));
  if (cached) { state.data = cached; render(); } else if (switching) clearView();
  if (state.loading) return;
  state.loading = true;
  $('refreshBtn').classList.add('spin');
  try {
    const u = urls(place);
    const [fc, ens, aq, ...metas] = await Promise.all([
      getJSON(u.fc, 3), getJSON(u.ens, 2).catch(() => null), getJSON(u.aq).catch(() => null),
      ...META_IDS.map(id => getJSON(metaUrl(id)).catch(() => null)),
    ]);
    const meta = {};
    META_IDS.forEach((id, i) => { if (metas[i]) meta[id] = { init: metas[i].last_run_initialisation_time, avail: metas[i].last_run_availability_time }; });
    if (placeId(state.place) !== placeId(place)) return;
    state.data = { t: Date.now(), fc, ens, aq, meta };
    cacheData(place, state.data);
    clearTimeout(state.retry);
    banner('');
    render();
  } catch (e) {
    console.error(e);
    const why = e.status ? `Le serveur météo est surchargé (erreur ${e.status})` : 'Pas de connexion';
    if (placeId(state.place) !== placeId(place)) return;
    if (!state.data) $('heroBody').innerHTML = '<div class="skeleton">Prévisions indisponibles pour le moment.</div>';
    banner(state.data
      ? `${why} : prévisions de ${hm(state.data.t)}${dayKey(state.data.t) === dayKey(Date.now()) ? '' : ` le ${fDM.format(state.data.t)}`} affichées. Nouvel essai dans 2 min.`
      : `${why} : impossible de charger les prévisions. Nouvel essai dans 2 min.`);
    clearTimeout(state.retry);
    state.retry = setTimeout(() => document.visibilityState === 'visible' && state.place && load(state.place), 120e3);
  } finally {
    state.loading = false;
    $('refreshBtn').classList.remove('spin');
    if (placeId(state.place) !== placeId(place)) load(state.place);
  }
}
function setHash(p) {
  const q = new URLSearchParams({ l: `${p.lat.toFixed(4)},${p.lon.toFixed(4)}`, n: p.name });
  if (p.cp) q.set('cp', p.cp);
  if (p.dep) q.set('d', p.dep);
  history.replaceState(null, '', '#' + q.toString());
}
function placeFromHash() {
  const q = new URLSearchParams(location.hash.slice(1)), l = q.get('l');
  if (!l) return null;
  const [lat, lon] = l.split(',').map(Number);
  if (!isFinite(lat) || !isFinite(lon)) return null;
  return { lat, lon, name: q.get('n') || 'Lieu', cp: q.get('cp') || '', dep: q.get('d') || '' };
}

/* ---------- lieux et favoris ---------- */
const favs = () => store.get('favs', []);
const isFav = p => favs().some(f => placeId(f) === placeId(p));
function toggleFav(p) {

function placeRow(p, i, kind) {

let results = [];
function renderSheet() {

  const list = favs();
  $('favList').innerHTML = list.length ? list.map((p, i) => placeRow(p, i, 'fav')).join('') : '<div class="empty">Touchez l\'étoile d\'un lieu pour le garder ici et en haut de l\'écran.</div>';

// Recherche via l'API Adresse (BAN) : tolere « st », les apostrophes manquantes et les codes postaux
const toPlace = f => ({ name: f.properties.name, lat: f.geometry.coordinates[1], lon: f.geometry.coordinates[0], cp: f.properties.postcode || '', dep: (f.properties.context || '').split(', ')[1] || '' });
const findPlaces = q => getJSON(`https://api-adresse.data.gouv.fr/search/?q=${encodeURIComponent(q)}&type=municipality&autocomplete=1&limit=8`).then(r => r.features.map(toPlace));
let searchTimer = null, searchSeq = 0;
function search(q) {
  clearTimeout(searchTimer);
  q = q.trim();
  if (q.length < 2) { results = []; renderSheet(); return; }
  searchTimer = setTimeout(async () => {
    const seq = ++searchSeq;
    try {
      const found = await findPlaces(q);
      if (seq !== searchSeq) return;
      results = found;
      if (!results.length) $('results').innerHTML = '<div class="empty">Aucune commune trouvée.</div>';
      else renderSheet();
    } catch { $('results').innerHTML = '<div class="empty">Recherche impossible hors connexion.</div>'; }
  }, 220);
}
function locate() {
  if (!navigator.geolocation) { $('geoTxt').textContent = 'Géolocalisation indisponible'; return; }
  $('geoTxt').textContent = 'Localisation...';
  navigator.geolocation.getCurrentPosition(async pos => {
    const lat = +pos.coords.latitude.toFixed(4), lon = +pos.coords.longitude.toFixed(4);
    let place = { name: 'Ma position', lat, lon, cp: '', dep: '' };
    try {
      const r = await getJSON(`https://geo.api.gouv.fr/communes?lat=${lat}&lon=${lon}&fields=nom,codesPostaux,departement`);
      if (r[0]) place = { ...place, name: r[0].nom, cp: (r[0].codesPostaux || [])[0] || '', dep: r[0].departement ? r[0].departement.nom : '' };
    } catch {}
    $('geoTxt').textContent = 'Utiliser ma position';
    $('sheet').close();
    load(place);
  }, err => {
    $('geoTxt').textContent = err.code === 1 ? 'Position refusée par le navigateur' : 'Position introuvable';
  }, { enableHighAccuracy: false, timeout: 12000, maximumAge: 10 * 60e3 });
}

const whenDay = (D, t) => { const k = dayKey(t); return k === D.todayKey ? "Aujourd'hui" : k === dayKey(D.now + DAY) ? 'Demain' : cap(fWdLong.format(t)); };
/* Les trois modeles cote a cote, tant qu'ils se recouvrent (~4 jours) */
const MODEL_LINES = [['meteofrance_arome_france_hd', 'AROME 1,5 km', '#e2663a'], ['meteofrance_arpege_europe', 'ARPEGE 11 km', '#2f7fe0'], ['ecmwf_ifs', 'ECMWF 9 km', '#9a6ad8']];
function renderModels(D) {
  const h = D.data.fc.hourly, t = h.time.map(s => s * 1000);
  const series = MODEL_LINES.map(([id, name, color]) => ({ id, name, color, v: h['temperature_2m_' + id] || [] }));
  const from = D.iNow, to = Math.min(series[1].v.findLastIndex(v => v != null), D.iNow + 96);
  const W = 320, HH = 172, x = i => 6 + (i - from) / (to - from) * (W - 12);
  const vals = series.flatMap(s => s.v.slice(from, to + 1).filter(v => v != null));
  const lo = Math.floor(Math.min(...vals)) - 1, hi = Math.ceil(Math.max(...vals)) + 1, y = v => 14 + (hi - v) / (hi - lo) * 128;
  let s = `<svg class="mchart" viewBox="0 0 ${W} ${HH}" role="img" aria-label="Température prévue par chaque modèle">`;
  let n0 = null;
  for (let i = from; i <= to + 1; i++) {
    const night = i <= to && D.isNight(t[i]);
    if (night && n0 == null) n0 = i;
    if (!night && n0 != null) { s += `<rect x="${x(n0).toFixed(1)}" y="8" width="${(x(i - 1) - x(n0)).toFixed(1)}" height="${HH - 30}" rx="6" fill="var(--night)"/>`; n0 = null; }
  }
  for (let v = Math.ceil(lo / 5) * 5; v <= hi; v += 5) s += `<line x1="0" x2="${W}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--line)" stroke-dasharray="2 4"/><text x="2" y="${(y(v) - 3).toFixed(1)}">${v}°</text>`;
  for (let i = from + 1; i <= to; i++) if (hourOf(t[i]) === 12 && x(i) > 18 && x(i) < W - 18) s += `<text x="${x(i).toFixed(1)}" y="${HH - 6}" text-anchor="middle">${wd(t[i]).replace('.', '').toLowerCase()} ${dayNum(t[i])}</text>`;
  for (const sr of series) {
    let d = '', pen = false;
    for (let i = from; i <= to; i++) {
      const v = sr.v[i];
      if (v == null) { pen = false; continue; }
      d += `${pen ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`;
      pen = true;
    }
    s += `<path d="${d}" fill="none" stroke="${sr.color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  s += '</svg>';
  let worst = { s: 0, i: from }, sum = 0, cnt = 0;
  for (let i = from; i <= to; i++) {
    const v = series.map(sr => sr.v[i]).filter(z => z != null);
    if (v.length < 2) continue;
    const sp = Math.max(...v) - Math.min(...v);
    sum += sp; cnt++;
    if (sp > worst.s) worst = { s: sp, i };
  }
  const avg = sum / cnt, r1 = v => num1(Math.round(v * 10) / 10);
  const at = i => `${whenDay(D, t[i]).toLowerCase()} vers ${hourOf(t[i])}h`;
  const verdict = worst.s <= 2 ? `Oui : moins de 2° d'écart sur les ${Math.round((to - from) / 24)} prochains jours.`
    : `${avg <= 1.5 ? 'Plutôt oui' : 'Pas vraiment'} : ${r1(avg)}° d'écart en moyenne, au plus ${r1(worst.s)}° ${at(worst.i)}.`;
  const dayList = D.days.slice(0, 4);
  const rows = series.map(sr => {
    const cells = dayList.map(d => {
      const cov = d.idx.filter(i => sr.v[i] != null);
      if (cov.length < 20) return '<td>-</td>';
      const mm = cov.reduce((p, i) => p + ((h['precipitation_' + sr.id] || [])[i + 1] || 0), 0);
      return `<td data-mm="${mm}">${mm < 0.1 ? '0' : num1(Math.round(mm * 10) / 10)}</td>`;
    }).join('');
    return `<tr><td><i style="display:inline-block;width:10px;height:3px;border-radius:2px;background:${sr.color};vertical-align:3px;margin-right:6px"></i>${sr.name.split(' ')[0]}</td>${cells}</tr>`;
  }).join('');
  $('models').innerHTML = `<p class="verdict">${verdict}</p>${s}
    <div class="mleg">${series.map(sr => `<span><i style="background:${sr.color}"></i>${sr.name}</span>`).join('')}</div>
    <table class="rtab"><tr><th>Pluie (mm)</th>${dayList.map((d, k) => `<th>${k ? `${wd(d.t0).replace('.', '')} ${dayNum(d.t0)}` : 'Auj.'}</th>`).join('')}</tr>${rows}</table>`;
  // desaccord sur la pluie : un modele >= 1 mm, un autre < 0,2 mm le meme jour
  const tab = $('models').querySelector('.rtab');
  dayList.forEach((d, k) => {
    const col = [...tab.rows].slice(1).map(r => r.cells[k + 1]).filter(c => c.dataset.mm != null);
    const mm = col.map(c => +c.dataset.mm);
    if (mm.length > 1 && Math.max(...mm) >= 1 && Math.min(...mm) < 0.2) col.forEach(c => c.classList.add('off'));
  });
}

/* 15 jours en courbe : maxi et mini du modele retenu, zones = plage p10-p90 des 51 scenarios, barres = proba de pluie */
function renderDaysChart(D) {
  const days = D.days, n = days.length, W = 320, HH = 214, cw = (W - 8) / n, cx = k => 4 + cw * (k + .5);
  const all = days.flatMap(d => [d.tmin, d.tmax, d.ens && d.ens.min10, d.ens && d.ens.max90, d.normal && d.normal.tx, d.normal && d.normal.tn]).filter(v => v != null);
  const lo = Math.floor(Math.min(...all)), hi = Math.ceil(Math.max(...all)), y = v => 20 + (hi - v) / (hi - lo || 1) * 118;
  const band = (a, b, fill) => {
    const ks = days.map((d, k) => d.ens ? k : null).filter(k => k != null);
    if (ks.length < 2) return '';
    const top = ks.map(k => `${cx(k).toFixed(1)},${y(days[k].ens[b]).toFixed(1)}`), bot = ks.slice().reverse().map(k => `${cx(k).toFixed(1)},${y(days[k].ens[a]).toFixed(1)}`);
    return `<polygon points="${top.concat(bot).join(' ')}" fill="${fill}" opacity=".2"/>`;
  };
  let s = `<svg class="dchart" viewBox="0 0 ${W} ${HH}" role="img" aria-label="Températures des 15 prochains jours">`;
  if (n > 10) s += `<rect x="${(cx(10) - cw / 2).toFixed(1)}" y="4" width="${(W - cx(10) + cw / 2).toFixed(1)}" height="${HH - 8}" rx="8" fill="var(--night)"/><text x="${(cx(10) - cw / 2 + 5).toFixed(1)}" y="14">tendance</text>`;
  const relay = days.findIndex((d, k) => k && MODELS[d.src].name === 'ECMWF' && MODELS[days[k - 1].src].name !== 'ECMWF');
  if (relay > 0) s += `<line x1="${(cx(relay) - cw / 2).toFixed(1)}" x2="${(cx(relay) - cw / 2).toFixed(1)}" y1="6" y2="${HH - 30}" stroke="var(--faint)" stroke-dasharray="3 3"/><text x="${(cx(relay) - cw / 2 + 4).toFixed(1)}" y="14">ECMWF</text>`;
  s += band('max10', 'max90', '#f0953f') + band('min10', 'min90', '#4aa3df');
  if (days.every(d => d.normal)) for (const [k, c] of [['tx', '#f0953f'], ['tn', '#4aa3df']])
    s += `<path d="${smooth(days.map((d, j) => [cx(j), y(d.normal[k])]))}" fill="none" stroke="${c}" stroke-width="1.4" stroke-dasharray="4 4" opacity=".75"/>`;
  const maxPts = days.map((d, k) => [cx(k), y(d.tmax)]), minPts = days.map((d, k) => [cx(k), y(d.tmin)]);
  s += `<path d="${smooth(maxPts)}" fill="none" stroke="#f0953f" stroke-width="2.6"/><path d="${smooth(minPts)}" fill="none" stroke="#4aa3df" stroke-width="2.6"/>`;
  days.forEach((d, k) => {
    s += `<circle cx="${cx(k).toFixed(1)}" cy="${y(d.tmax).toFixed(1)}" r="2.6" fill="#f0953f"/><circle cx="${cx(k).toFixed(1)}" cy="${y(d.tmin).toFixed(1)}" r="2.6" fill="#4aa3df"/>`;
    s += `<text class="vmax" x="${cx(k).toFixed(1)}" y="${(y(d.tmax) - 7).toFixed(1)}" text-anchor="middle">${Math.round(d.tmax)}</text>`;
    s += `<text x="${cx(k).toFixed(1)}" y="${(y(d.tmin) + 14).toFixed(1)}" text-anchor="middle">${Math.round(d.tmin)}</text>`;
    const p = d.ens ? d.ens.pRain : 0;
    if (p > 0.02) s += `<rect x="${(cx(k) - cw * .32).toFixed(1)}" y="${(178 - p * 24).toFixed(1)}" width="${(cw * .64).toFixed(1)}" height="${(p * 24).toFixed(1)}" rx="2" fill="var(--rain)" opacity="${(.3 + .6 * p).toFixed(2)}"/>`;
    s += `<text x="${cx(k).toFixed(1)}" y="194" text-anchor="middle">${k ? wd(d.t0).slice(0, 2).toLowerCase() : 'auj'}</text><text x="${cx(k).toFixed(1)}" y="207" text-anchor="middle">${dayNum(d.t0)}</text>`;
  });
  s += `<line x1="0" x2="${W}" y1="178.5" y2="178.5" stroke="var(--line)"/></svg>`;
  const normLeg = days.every(d => d.normal) ? '<span><i style="background:repeating-linear-gradient(90deg,var(--muted) 0 3px,transparent 3px 5px);height:2px"></i>normales</span>' : '';
  $('daysChart').innerHTML = s + `<div class="legend"><span><i style="background:#f0953f"></i>maxi</span><span><i style="background:#4aa3df"></i>mini</span>${normLeg}<span><i style="background:var(--rain);opacity:.6"></i>proba de pluie ≥ 1 mm</span></div>`;
}

  let txt, btns = '';
  if (!alertSupported) txt = "Une notification quand la nuit à venir risque de geler. Disponible sur Android, dans Chrome, une fois l'app installée sur l'écran d'accueil.";
  else if (on) {
    txt = `Activée pour ${esc(on.name)}. Chrome vérifie quelques fois par jour, à son rythme, et ne prévient qu'une fois par nuit.`;
    btns = `<button type="button" class="ghost" data-alert="test">Tester</button><button type="button" class="ghost" data-alert="off">Désactiver</button>`;
  } else {
    txt = 'Une notification quand la nuit à venir risque de geler (gel, ou gelée blanche par nuit claire et calme).';
    if (here) btns = `<button type="button" data-alert="on">Activer pour ${esc(here.name)}</button>`;
  }
  $('alert').innerHTML = `<div class="alert"><div><b>Alerte gel</b>${alertMsg || txt}</div>${btns}</div>`;
  alertMsg = '';
}
async function alertAction(kind) {
  const reg = await navigator.serviceWorker.ready;
  if (kind === 'off') {
    await reg.periodicSync.unregister('gel');
    reg.active.postMessage({ type: 'gel-config', alert: null });
    store.del('alert');
  } else {
    if (await Notification.requestPermission() !== 'granted') { alertMsg = 'Notifications refusées : autorisez-les dans les réglages du site.'; return renderAlert(); }
    if (kind === 'on') {
      const perm = await navigator.permissions.query({ name: 'periodic-background-sync' }).catch(() => ({ state: 'denied' }));
      if (perm.state !== 'granted') { alertMsg = "Chrome ne permet la vérification en arrière-plan qu'à une app installée : installez Ciel sur l'écran d'accueil, puis réessayez."; return renderAlert(); }
      const p = { name: state.place.name, lat: state.place.lat, lon: state.place.lon };
      await reg.periodicSync.register('gel', { minInterval: 6 * HOUR });
      reg.active.postMessage({ type: 'gel-config', alert: p });
      store.set('alert', p);
    } else reg.active.postMessage({ type: 'gel-test' });
  }
  renderAlert();
}
$('alert').addEventListener('click', e => { const b = e.target.closest('[data-alert]'); if (b) alertAction(b.dataset.alert).catch(err => { alertMsg = `Impossible : ${esc(err.message)}`; renderAlert(); }); });
/* ---------- v5 : explorer un jour, n'importe ou en France ---------- */
// Source la plus fine disponible : la prevision du jour (aujourd'hui et apres), les archives des previsions Meteo-France
// AROME / ARPEGE (gardees par Open-Meteo depuis l'automne 2022), sinon la reanalyse ERA5 (depuis 1940).
const HF_START = '2022-10-01', XP_MIN = '1940-01-01';
const wide = matchMedia('(min-width: 920px)');
const xp = { started: false, own: false, place: null, key: null, seq: 0, res: [] };
const addDays = (key, n) => { const [y, m, d] = key.split('-').map(Number); return dayKey(Date.UTC(y, m - 1, d + n, 12)); };
const addYears = (key, n) => {
  const [y, m, d] = key.split('-').map(Number), dim = new Date(Date.UTC(y + n, m, 0)).getUTCDate();
  return dayKey(Date.UTC(y + n, m - 1, Math.min(d, dim), 12));
};
const keyTime = key => { const [y, m, d] = key.split('-').map(Number); return Date.UTC(y, m - 1, d, 12); };
const xpMax = () => addDays(dayKey(Date.now()), 14);
async function xpFetch(p, key) {
  const loc = `latitude=${p.lat.toFixed(4)}&longitude=${p.lon.toFixed(4)}&timezone=${encodeURIComponent(TZ)}&timeformat=unixtime&start_date=${key}&end_date=${addDays(key, 1)}`;
  const mf = `&hourly=${HOURLY}&models=${MODELS.map(m => m.id)}`;
  if (key >= dayKey(Date.now())) return { r: await getJSON(`https://api.open-meteo.com/v1/forecast?${loc}${mf}`, 2), models: MODELS, kind: 'fc' };
  if (key >= HF_START) {
    const r = await getJSON(`https://historical-forecast-api.open-meteo.com/v1/forecast?${loc}${mf}`, 2).catch(() => null);
    if (r && mergeHourly(r.hourly, MODELS).temperature_2m.filter(v => v != null).length >= 30) return { r, models: MODELS, kind: 'hf' };
  }
  const vars = HOURLY.filter(v => v !== 'precipitation_probability');
  return { r: await getJSON(`https://archive-api.open-meteo.com/v1/archive?${loc}&hourly=${vars}`, 2), models: null, kind: 'era5' };
}
function xpStart() {
  if (!state.place) return;
  xp.started = true;
  xp.place = state.place;
  xp.key = addYears(dayKey(Date.now()), -1);
  const pin = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';
  $('explore').innerHTML = `
    <div class="xp-bar">
      <button class="xp-place" type="button" id="xpPlace">${pin}<span></span></button>
      <input type="date" id="xpDate" min="${XP_MIN}" aria-label="Date">
    </div>
    <div class="xp-quick"><button type="button" data-xs="-y">−1 an</button><button type="button" data-xs="-1">−1 j</button><button type="button" data-xs="1">+1 j</button><button type="button" data-xs="y">+1 an</button><i></i><button type="button" data-xq="0">Aujourd'hui</button><button type="button" data-xq="10">Il y a 10 ans</button><button type="button" data-xq="30">30 ans</button><button type="button" data-xq="50">50 ans</button></div>
    <div class="xp-search" id="xpSearch" hidden><input type="search" id="xpQ" placeholder="Commune ou code postal" autocomplete="off" enterkeyhint="search"><div id="xpRes"></div></div>
    <div id="xpOut"></div>`;
  $('xpDate').addEventListener('change', e => { if (e.target.value) xpGo(e.target.value); });
  $('explore').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.id === 'xpPlace') { const s = $('xpSearch'); s.hidden = !s.hidden; if (!s.hidden) { $('xpQ').value = ''; xpResults([]); $('xpQ').focus(); } }
    if (b.dataset.xs) xpGo(b.dataset.xs === 'y' ? addYears(xp.key, 1) : b.dataset.xs === '-y' ? addYears(xp.key, -1) : addDays(xp.key, +b.dataset.xs));
    if (b.dataset.xq) xpGo(addYears(dayKey(Date.now()), -b.dataset.xq));
    if (b.dataset.xp != null) {
      const p = b.dataset.xp === 'main' ? state.place : xp.res[+b.dataset.xp];
      xp.own = b.dataset.xp !== 'main';
      xp.place = p;
      $('xpSearch').hidden = true;
      xpLoad();
    }
  });
  let timer = null, seq = 0;
  $('xpQ').addEventListener('input', e => {
    clearTimeout(timer);
    const q = e.target.value.trim();
    if (q.length < 2) { xpResults([]); return; }
    timer = setTimeout(async () => {
      const n = ++seq;
      try { const r = await findPlaces(q); if (n === seq) xpResults(r); } catch { $('xpRes').innerHTML = '<div class="empty">Recherche impossible hors connexion.</div>'; }
    }, 220);
  });
  xpLoad();
}
function xpResults(list) {
  xp.res = list;
  const main = state.place ? `<div class="row"><button class="pick" type="button" data-xp="main">${esc(state.place.name)}<small>le lieu affiché en haut</small></button></div>` : '';
  $('xpRes').innerHTML = list.map((p, i) => `<div class="row"><button class="pick" type="button" data-xp="${i}">${esc(p.name)}<small>${esc([p.cp, p.dep].filter(Boolean).join(' · '))}</small></button></div>`).join('') || main;
}
function xpGo(key) {
  key = key < XP_MIN ? XP_MIN : key > xpMax() ? xpMax() : key;
  xp.key = key;
  xpLoad();
}
async function xpLoad() {
  const p = xp.place, key = xp.key, n = ++xp.seq;
  $('xpPlace').querySelector('span').textContent = p.name;
  $('xpDate').max = xpMax();
  $('xpDate').value = key;
  $('xpOut').innerHTML = '<div class="empty">Chargement...</div>';
  try {
    const { r, models, kind } = await xpFetch(p, key);
    const norm = await loadNormals(p, r.elevation).catch(() => null);
    if (n === xp.seq) $('xpOut').innerHTML = xpView(p, key, r, models, kind, norm);
  } catch (e) {
    console.error(e);
    if (n === xp.seq) $('xpOut').innerHTML = `<div class="empty">${e.status ? `Le serveur météo ne répond pas (erreur ${e.status}).` : 'Pas de connexion.'} Réessayez dans un moment.</div>`;
  }
}
function xpView(p, key, r, models, kind, N) {
  const H = mergeHourly(r.hourly, models);
  const idx = H.t.map((x, i) => i).filter(i => dayKey(H.t[i]) === key);
  const T = idx.map(i => H.temperature_2m[i]).filter(v => v != null);
  if (T.length < 18) return '<div class="empty">Pas de données pour ce jour à cet endroit.</div>';
  const sunC = {};
  const isNight = ts => { const k = dayKey(ts), s = sunC[k] || (sunC[k] = sunTimes(k, p.lat, p.lon)); return ts < s.sunrise || ts > s.sunset; };
  const tmin = Math.min(...T), tmax = Math.max(...T);
  const rain = idx.reduce((s, i) => s + (H.precipitation[i + 1] || 0), 0), snow = idx.reduce((s, i) => s + (H.snowfall[i + 1] || 0), 0);
  const gust = maxOf(idx, H.wind_gusts_10m), code = dayCode(H, idx);
  const nm = N ? normalOn(N, key) : null;
  const t0 = keyTime(key), today = dayKey(Date.now());
  const when = key === today ? "aujourd'hui" : key > today ? 'prévision' : (() => {
    const yrs = +today.slice(0, 4) - +key.slice(0, 4) - (today.slice(5) < key.slice(5) ? 1 : 0);
    const days = Math.round((keyTime(today) - t0) / DAY);
    return yrs >= 1 ? `il y a ${yrs} an${yrs > 1 ? 's' : ''}` : `il y a ${days} jour${days > 1 ? 's' : ''}`;
  })();
  const fact = (v, l) => `<div><b>${v}</b>${l}</div>`;
  const facts = [
    fact(`${deg(tmin)}${nm ? `<span class="an ${anomCls(tmin - nm.tn)}">${anomTxt(tmin - nm.tn)}</span>` : ''}`, 'mini'),
    fact(`${deg(tmax)}${nm ? `<span class="an ${anomCls(tmax - nm.tx)}">${anomTxt(tmax - nm.tx)}</span>` : ''}`, 'maxi'),
    fact(`${num1(Math.round(rain * 10) / 10)} mm`, snow >= 0.5 ? `pluie, dont ${num1(Math.round(snow))} cm de neige` : 'pluie'),
    fact(gust > -Infinity ? `${Math.round(gust)} km/h` : '-', 'rafales maxi'),
  ];
  const items = dayExtras(H, idx);
  if (nm) {
    items.push(normalLine(N, nm, tmin, tmax));
    const m = nm.month;
    if (N.hx && N.dist <= 25 && tmax > N.hx[m]) items.push(`Plus chaud que le record de ${MONTHS[m]} de la station (${deg1(N.hx[m])}) : à prendre avec prudence, la source n'est pas la station elle-même.`);
    if (N.lx && N.dist <= 25 && tmin < N.lx[m]) items.push(`Plus froid que le record de ${MONTHS[m]} de la station (${deg1(N.lx[m])}) : à prendre avec prudence, la source n'est pas la station elle-même.`);
  }
  if (kind === 'era5') items.push("Source : réanalyse ERA5 de Copernicus (ECMWF), le temps reconstitué à partir des observations sur une maille de 9 à 25 km. Moins fine qu'une station : en relief ou près de la mer, l'écart peut atteindre quelques degrés.");
  else {
    const used = [...new Set(idx.map(i => H.src[i]).filter(x => x >= 0))].map(x => MODELS[x]);
    const names = used.filter((m, k) => !k || m.name !== used[k - 1].name).map(m => `${m.name} ${m.grid}`).join(' puis ');
    items.push(kind === 'hf'
      ? `Source : archives des prévisions Météo-France (${names}), gardées par Open-Meteo depuis l'automne 2022. C'est la prévision à quelques heures d'échéance : très proche de ce qui s'est passé, mais ce n'est pas une mesure.`
      : `Source : prévision ${names}, à confirmer le jour venu.`);
  }
  return `<div class="xp-head">${ico(iconFor(code, false))}<div><b>${cap(fFull.format(t0))} ${key.slice(0, 4)}</b><span>${esc(p.name)} · ${label(code, false) || ''} · ${when}</span></div></div>
    <div class="xp-facts">${facts.join('')}</div>
    <div class="day-detail">${hourlySvg({ H, isNight, todayKey: '' }, idx[0], idx[idx.length - 1] + 1, { dayLabels: false })}
    <ul>${items.map(x => `<li>${x}</li>`).join('')}</ul></div>`;
}
wide.addEventListener('change', () => { if (wide.matches && !xp.started) xpStart(); });

applyTheme(store.get('theme', 'dark'));
renderFoot();
load(placeFromHash() || store.get('place') || DEFAULT_PLACE);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register(`sw.js?v=${APP_VERSION}`).catch(() => {});
</script>
